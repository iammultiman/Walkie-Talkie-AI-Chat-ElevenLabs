    <style>
      body {
        overscroll-behavior: none;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Custom Scrollbar Styles */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      
      /* Dark mode scrollbar */
      html.dark ::-webkit-scrollbar-thumb {
        background-color: #4f46e5; /* indigo-600 */
        border-radius: 4px;
      }
      html.dark ::-webkit-scrollbar-thumb:hover {
        background-color: #4338ca; /* indigo-700 */
      }
      
      /* Light mode scrollbar */
      html:not(.dark) ::-webkit-scrollbar-thumb {
        background-color: #a5b4fc; /* indigo-300 */
        border-radius: 4px;
      }
      html:not(.dark) ::-webkit-scrollbar-thumb:hover {
        background-color: #818cf8; /* indigo-400 */
      }

      /* Markdown Styles */
      .markdown-content ul { list-style-type: disc; margin-left: 1.5em; margin-top: 0.5em; margin-bottom: 0.5em; }
      .markdown-content ol { list-style-type: decimal; margin-left: 1.5em; margin-top: 0.5em; margin-bottom: 0.5em; }
      .markdown-content p { margin-bottom: 0.5em; }
      .markdown-content p:last-child { margin-bottom: 0; }
      .markdown-content code { background-color: rgba(0,0,0,0.1); padding: 0.2em 0.4em; border-radius: 4px; font-family: monospace; }
      .dark .markdown-content code { background-color: rgba(255,255,255,0.1); }
      .markdown-content pre { background-color: rgba(0,0,0,0.1); padding: 1em; border-radius: 8px; overflow-x: auto; margin-top: 0.5em; margin-bottom: 0.5em; }
      .dark .markdown-content pre { background-color: rgba(0,0,0,0.2); }
      .markdown-content pre code { background-color: transparent; padding: 0; }
      .markdown-content strong { font-weight: bold; }
      .markdown-content em { font-style: italic; }
      .markdown-content h1, .markdown-content h2, .markdown-content h3 { font-weight: bold; margin-top: 1em; margin-bottom: 0.5em; }
      .markdown-content h1 { font-size: 1.5em; }
      .markdown-content h2 { font-size: 1.3em; }
      .markdown-content h3 { font-size: 1.1em; }
      .markdown-content a { text-decoration: underline; }
      .markdown-content blockquote { border-left: 4px solid rgba(0,0,0,0.2); padding-left: 1em; margin-left: 0; font-style: italic; }
      .dark .markdown-content blockquote { border-left-color: rgba(255,255,255,0.2); }
    </style>

}
